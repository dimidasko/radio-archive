name: Update Radio Archives

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # This is the current stable version

      - name: Set up Python
        uses: actions/setup-python@v5 # Upgraded from v4 to v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        # Ensure the filename here matches your actual script name exactly
        run: python update-archive.py 

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add *.json
          # The '|| true' prevents the action from failing if there are no new shows
          git commit -m "Automated update of radio archives" || true
          git push
