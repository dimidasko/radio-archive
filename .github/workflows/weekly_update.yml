name: Update Radio Archives

on:
  schedule:
    # This runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # This adds a "Run now" button for manual updates

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to save the JSON back to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add *.json
          git commit -m "Automated update of radio archives" || echo "No changes to commit"
          git push
