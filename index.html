<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Radio Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen pb-24">

    <!-- Header -->
    <nav class="bg-gray-800 border-b border-orange-500 p-4 sticky top-0 z-10 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-orange-500 tracking-tight">MY RADIO ARCHIVE</h1>
            <button onclick="renderDiscovery()" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm font-bold border border-gray-500 transition">
                🔍 DISCOVER
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app" class="max-w-4xl mx-auto p-4">
        <div id="loading" class="text-center mt-20 text-gray-500 animate-pulse">Loading your archive...</div>
        <div id="showGrid" class="grid gap-4"></div>
    </main>

    <!-- Persistent Player -->
    <div id="playerContainer" class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t-2 border-orange-500 p-3 hidden shadow-2xl">
        <div class="max-w-4xl mx-auto">
            <p id="nowPlayingTitle" class="text-xs text-orange-400 truncate mb-2 font-bold px-1"></p>
            <audio id="mainAudioPlayer" controls class="w-full h-10 rounded-none">
                <source id="audioSource" src="" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <script>
        const GITHUB_USER = "dimidasko"; // Change this!
        const GITHUB_REPO = "radio-archive"; // Change this!
        const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/`;
        
        // Global state to store data after the first fetch
        let cachedActiveShows = null;

        // 1. Initialize App: Load Active Shows 
        async function init() {
            const grid = document.getElementById('showGrid');
            const app = document.getElementById('app');
            
            // Ensure the main layout is visible (in case we are coming back from Discovery)
            app.innerHTML = `
                <div id="loading" class="text-center mt-20 text-gray-500 animate-pulse">Loading your archive...</div>
                <div id="showGrid" class="grid gap-4"></div>
            `;
      
            // Use cache if we already have it, otherwise fetch
            if (cachedActiveShows) {
                renderArchive(cachedActiveShows);
            } else {
                try {
                    const response = await fetch(RAW_BASE + 'active_shows.json');
                    if (!response.ok) throw new Error("File not found");
                    cachedActiveShows = await response.json();
                    renderArchive(cachedActiveShows);
                } catch (err) {
                    document.getElementById('app').innerHTML = `
                        <div class="text-center mt-20">
                            <div class="text-red-400 p-4 bg-red-900/20 rounded border border-red-800 inline-block">
                                Error loading active_shows.json. Check your URL and File.
                            </div>
                            <br><button onclick="location.reload()" class="mt-4 text-orange-500 underline">Reload Page</button>
                        </div>`;
                }
            }
        }
        
        // Update the renderArchive to ensure the loading message disappears correctly
        function renderArchive(shows) {
            const grid = document.getElementById('showGrid');
            const loading = document.getElementById('loading');
            
            if (loading) loading.classList.add('hidden');
            
            if (!grid) return; // Safety check
        
            grid.innerHTML = shows.map(show => `
                <div class="bg-gray-800 rounded-lg p-4 border border-gray-700 hover:border-orange-500/50 transition shadow-sm">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h2 class="text-lg font-bold text-white">${show.title}</h2>
                            <span class="text-[10px] bg-orange-900/40 text-orange-300 px-2 py-0.5 rounded uppercase tracking-widest">${show.station}</span>
                        </div>
                        <button onclick="loadEpisodes('${show.filename}', '${show.title}')" 
                                class="bg-orange-500 hover:bg-orange-400 text-black px-4 py-2 rounded font-black text-sm transition shadow-lg">
                            VIEW
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 2. Render the Main List of Active Shows
        function renderArchive(shows) {
            const grid = document.getElementById('showGrid');
            document.getElementById('loading').classList.add('hidden');
            
            grid.innerHTML = shows.map(show => `
                <div class="bg-gray-800 rounded-lg p-4 border border-gray-700 hover:border-orange-500/50 transition">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h2 class="text-lg font-bold text-white">${show.title}</h2>
                            <span class="text-[10px] bg-orange-900/40 text-orange-300 px-2 py-0.5 rounded uppercase tracking-widest">${show.station}</span>
                        </div>
                        <button onclick="loadEpisodes('${show.filename}', '${show.title}')" 
                                class="bg-orange-500 hover:bg-orange-400 text-black px-4 py-2 rounded font-black text-sm transition shadow-lg">
                            VIEW EPISODES
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 3. Load Episodes for a Specific Show
        async function loadEpisodes(filename, title) {
            const app = document.getElementById('app');
            app.innerHTML = `<div class="text-center mt-10"><button onclick="init()" class="text-orange-500 mb-4 underline font-bold">← BACK TO LIST</button><p class="animate-pulse">Fetching episodes for ${title}...</p></div>`;

            try {
                const res = await fetch(RAW_BASE + filename);
                const episodes = await res.json();
                
                app.innerHTML = `
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold">${title}</h2>
                        <button onclick="init()" class="bg-gray-700 px-3 py-1 rounded text-xs font-bold uppercase">Back</button>
                    </div>
                    <div class="space-y-2">
                        ${episodes.map(ep => `
                            <div class="bg-gray-800 p-3 rounded flex justify-between items-center border-l-4 border-orange-600">
                                <span class="text-sm font-medium">${ep.title}</span>
                                <div class="flex gap-2">
                                    <button onclick="playAudio('${ep.mp3}', '${ep.title}')" class="bg-gray-700 text-orange-400 p-2 rounded hover:bg-orange-500 hover:text-black transition">▶</button>
                                    <a href="${ep.mp3}" download class="bg-gray-700 text-white p-2 rounded hover:bg-blue-600 transition">💾</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (err) {
                app.innerHTML = `<div class="text-center mt-10"><p class="text-red-400">Archive file ${filename} not found yet.</p><button onclick="init()" class="mt-4 text-orange-500 underline">Back to List</button></div>`;
            }
        }

        // 4. Discovery View
        async function renderDiscovery() {
            const app = document.getElementById('app');
            app.innerHTML = `<p class="text-center mt-10 animate-pulse">Browsing ERT library...</p>`;
            
            try {
                const res = await fetch(RAW_BASE + 'available_shows.json');
                const shows = await res.json();
                
                app.innerHTML = `
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold">Discover New Shows</h2>
                        <button onclick="init()" class="bg-gray-700 px-3 py-1 rounded text-xs font-bold uppercase">Back</button>
                    </div>
                    <div class="space-y-3">
                        ${shows.map(s => `
                            <div class="bg-gray-800 p-4 rounded-lg border-l-2 border-gray-600">
                                <p class="font-bold text-orange-400">${s.title}</p>
                                <p class="text-[10px] text-gray-400 uppercase">${s.station}</p>
                                <p class="text-[11px] text-gray-500 mt-1 italic">🕒 ${s.air_time}</p>
                                <button onclick="copyToClipboard('${s.title}', '${s.url}', '${s.filename}', '${s.station}')" 
                                        class="mt-3 w-full bg-gray-700 hover:bg-orange-600 py-1 rounded text-[10px] font-bold uppercase transition">
                                    Copy Config for GitHub
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (err) {
                app.innerHTML = `<p class="text-center mt-10">available_shows.json not found.</p>`;
            }
        }

        function playAudio(url, title) {
            const container = document.getElementById('playerContainer');
            const player = document.getElementById('mainAudioPlayer');
            const source = document.getElementById('audioSource');
            const titleEl = document.getElementById('nowPlayingTitle');

            container.classList.remove('hidden');
            titleEl.innerText = "PLAYING: " + title;
            source.src = url;
            player.load();
            player.play();
        }

        function copyToClipboard(title, url, filename, station) {
            const config = JSON.stringify({title, url, filename, station}, null, 2);
            navigator.clipboard.writeText(config + ",");
            alert("Config copied! Paste it into your active_shows.json file on GitHub.");
        }

        init();
    </script>
</body>
</html>
